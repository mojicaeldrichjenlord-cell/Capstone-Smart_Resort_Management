<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ======================================================
       RESPONSIVE VIEWPORT
       Makes forgot password page mobile-friendly.
  ======================================================= -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Forgot Password | SmartResort</title>

  <!-- ======================================================
       GLOBAL CSS
       Existing main stylesheet of the system.
  ======================================================= -->
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ======================================================
       SECTION 1: Page background and layout
       Centers the forgot password card.
    ======================================================= */

    .forgot-page {
      min-height: 100vh;
      background:
        linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.48)),
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80")
        center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .forgot-card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 30px;
      padding: 34px 30px;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .forgot-badge {
      display: inline-flex;
      padding: 9px 13px;
      border-radius: 999px;
      background: #ecfeff;
      color: #0f766e;
      font-weight: 800;
      font-size: 0.85rem;
      margin-bottom: 16px;
      border: 1px solid #99f6e4;
    }

    .forgot-card h1 {
      margin: 0 0 8px;
      color: #0f172a;
      font-size: 2rem;
    }

    .forgot-card p {
      margin: 0 0 20px;
      color: #64748b;
      line-height: 1.65;
    }

    /* ======================================================
       SECTION 2: Form styling
       Styles inputs, labels, and buttons.
    ======================================================= */

    .forgot-form {
      display: grid;
      gap: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #0f172a;
      font-weight: 800;
    }

    .form-group input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      outline: none;
      font-size: 1rem;
      background: #fff;
    }

    .form-group input:focus {
      border-color: #14b8a6;
      box-shadow: 0 0 0 3px rgba(20,184,166,0.15);
    }

    .otp-section {
      display: none;
      background: #f8fafc;
      border: 1px solid #dbe7ef;
      border-radius: 18px;
      padding: 16px;
      margin-top: 4px;
    }

    .otp-section.show {
      display: block;
    }

    .action-row {
      display: grid;
      gap: 10px;
      margin-top: 6px;
    }

    .primary-btn,
    .secondary-btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .primary-btn {
      background: linear-gradient(135deg, #14b8a6, #0f9488);
      color: white;
      box-shadow: 0 14px 28px rgba(20,184,166,0.2);
    }

    .secondary-btn {
      background: #e2e8f0;
      color: #0f172a;
    }

    .message {
      margin-top: 14px;
      text-align: center;
      font-weight: 800;
      line-height: 1.5;
    }

    /* ======================================================
       SECTION 3: Mobile responsiveness
       Adjusts spacing for phones.
    ======================================================= */

    @media (max-width: 480px) {
      .forgot-card {
        padding: 24px 18px;
        border-radius: 22px;
      }

      .forgot-card h1 {
        font-size: 1.65rem;
      }
    }
  </style>
</head>

<body class="forgot-page">
  <main class="forgot-card">

    <!-- ======================================================
         PAGE HEADER
         Explains forgot password process.
    ======================================================= -->
    <div class="forgot-badge">Email OTP Verification</div>

    <h1>Forgot Password</h1>

    <p>
      Enter your registered email. We will send a 6-digit OTP code so you can reset your password securely.
    </p>

    <!-- ======================================================
         FORGOT PASSWORD FORM
         Step 1: Send OTP
         Step 2: Enter OTP and new password
    ======================================================= -->
    <form id="forgotPasswordForm" class="forgot-form">
      <div class="form-group">
        <label for="email">Registered Email</label>
        <input type="email" id="email" placeholder="Enter your account email" required />
      </div>

      <button type="button" class="primary-btn" id="sendOtpBtn">
        Send OTP
      </button>

      <section id="otpSection" class="otp-section">
        <div class="form-group">
          <label for="otp">OTP Code</label>
          <input type="text" id="otp" maxlength="6" placeholder="Enter 6-digit OTP" />
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            placeholder="At least 8 characters"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter new password"
          />
        </div>

        <div class="action-row">
          <button type="submit" class="primary-btn" id="resetPasswordBtn">
            Reset Password
          </button>

          <button type="button" class="secondary-btn" id="resendOtpBtn">
            Resend OTP
          </button>
        </div>
      </section>

      <a href="login.html" class="secondary-btn">Back to Login</a>
    </form>

    <p id="forgotMessage" class="message"></p>
  </main>

  <!-- ======================================================
       PAGE SCRIPTS
       toast.js shows notifications.
       forgot-password.js handles OTP flow.
  ======================================================= -->
  <script src="js/toast.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
