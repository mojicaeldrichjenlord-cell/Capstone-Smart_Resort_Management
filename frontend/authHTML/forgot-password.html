<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ======================================================
       RESPONSIVE VIEWPORT
       Makes forgot password page mobile-friendly.
    ======================================================= -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password | SmartResort</title>

    <!-- ======================================================
       PAGE CSS FILES
       global.css = shared reusable styles
       forgot-password.css = forgot password page only
    ======================================================= -->
    <link rel="stylesheet" href="../sharedCSS/global.css" />
    <link rel="stylesheet" href="../authCSS/forgot-password.css" />
  </head>

  <body class="forgot-page">
    <main class="forgot-card">
      <!-- ======================================================
         PAGE HEADER
         Explains forgot password process.
      ======================================================= -->
      <div class="forgot-badge">Email OTP Verification</div>

      <h1>Forgot Password</h1>

      <p>
        Enter your registered email. We will send a 6-digit OTP code so you can
        reset your password securely.
      </p>

      <!-- ======================================================
         FORGOT PASSWORD FORM
         Step 1: Send OTP
         Step 2: Enter OTP and new password
      ======================================================= -->
      <form id="forgotPasswordForm" class="forgot-form">
        <div class="form-group">
          <label for="email">Registered Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your account email"
            required
          />
        </div>

        <!-- ======================================================
           FIRST OTP BUTTON
           This appears first. It will hide after OTP is sent.
        ======================================================= -->
        <button type="button" class="primary-btn" id="sendOtpBtn">
          Send OTP
        </button>

        <!-- ======================================================
           OTP SECTION
           Hidden first, then shown after OTP is sent.
        ======================================================= -->
        <section id="otpSection" class="otp-section">
          <div class="form-group">
            <label for="otp">OTP Code</label>
            <input
              type="text"
              id="otp"
              maxlength="6"
              placeholder="Enter 6-digit OTP"
            />
          </div>

          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input
              type="password"
              id="newPassword"
              placeholder="At least 8 characters"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Re-enter new password"
            />
          </div>

          <div class="action-row">
            <button type="submit" class="primary-btn" id="resetPasswordBtn">
              Reset Password
            </button>

            <button type="button" class="secondary-btn" id="resendOtpBtn">
              Resend OTP
            </button>
          </div>

          <p id="resendTimerText" class="resend-timer-text"></p>
        </section>

        <a href="login.html" class="secondary-btn">Back to Login</a>
      </form>

      <p id="forgotMessage" class="message"></p>
    </main>

    <!-- ======================================================
       PAGE SCRIPTS
       toast.js shows notifications.
       forgot-password.js handles OTP flow.
    ======================================================= -->
    <script src="../sharedJS/toast.js"></script>
    <script src="../authJS/forgot-password.js"></script>
  </body>
</html>
