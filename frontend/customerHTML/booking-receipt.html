<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Booking Receipt | Arvic Seaside</title>

  <link rel="stylesheet" href="../sharedCSS/global.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../customerCSS/booking-receipt.css" />
  <link rel="stylesheet" href="../sharedCSS/customer-navbar.css" />
</head>

<body>
  <header class="navbar">
    <div class="logo">Arvic Seaside</div>

    <button id="menuToggle" class="menu-toggle" type="button">☰</button>

    <nav id="mobileNav">
      <a href="index.html">Home</a>
      <a href="rooms.html">Accommodations</a>
      <a href="resort-map.html">Resort Map</a>
      <a href="my-bookings.html" class="active-nav">My Bookings</a>
      <a href="profile.html">Profile</a>
      <a href="#" id="logoutBtn">Logout</a>
    </nav>
  </header>

  <section class="page-header">
    <h1>Booking Receipt</h1>
    <p>Keep this simple receipt as your reservation reference for front-desk verification.</p>
  </section>

  <main class="receipt-page-wrapper">
    <div class="receipt-top-actions">
      <a href="my-bookings.html" class="back-btn">← Back to My Bookings</a>
    </div>

    <section class="receipt-shell">
      <div id="receiptBox">
        <div class="receipt-loading-box">Loading receipt...</div>
      </div>

      <div class="receipt-actions">
        <a href="my-bookings.html" class="btn-secondary">Back to My Bookings</a>
      </div>
    </section>
  </main>

  <script src="../sharedJS/toast.js"></script>
  <script src="../sharedJS/api-config.js"></script>
  <script src="../customerJS/booking-receipt.js"></script>

  <script>
    const menuToggle = document.getElementById("menuToggle");
    const mobileNav = document.getElementById("mobileNav");

    if (menuToggle && mobileNav) {
      menuToggle.addEventListener("click", () => {
        mobileNav.classList.toggle("show");
        menuToggle.textContent = mobileNav.classList.contains("show") ? "×" : "☰";
      });
    }
  </script>
</body>
</html>
