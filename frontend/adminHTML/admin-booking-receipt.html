<!doctype html>
<!-- Page structure for admin booking receipt. Scripts update its interactive parts. Keep IDs aligned with the linked JavaScript. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Thermal Receipt | SmartResort</title>

  <link rel="stylesheet" href="../sharedCSS/global.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../adminCSS/admin-booking-receipt.css" />
</head>

<body>
  <header class="navbar">
    <div class="logo">SmartResort Admin</div>

    <nav>
      <a href="admin.html">Bookings</a>
      <a href="admin-rooms.html">Accommodations</a>
      <a href="admin-map-editor.html">Map Editor</a>
      <a href="admin-reports.html">Reports</a>
      <a href="admin-profile.html">Profile</a>
      <a href="#" id="logoutBtn">Logout</a>
    </nav>
  </header>

  <main class="receipt-page">
    <div class="top-actions">
      <a href="admin.html" class="back-btn">← Back to Dashboard</a>

      <button id="printThermalBtn" class="print-btn" type="button">
        Print Thermal Receipt
      </button>
    </div>

    <section class="receipt-preview-card">
      <div class="preview-header">
        <h1>Thermal Receipt</h1>
        <p>Read-only reservation receipt for administrative review and printing.</p>
      </div>

      <div id="thermalReceipt" class="thermal-receipt-shell">
        <div class="thermal-inner">
          <div class="thermal-center">Loading receipt...</div>
        </div>
      </div>
    </section>
  </main>

  <script src="../sharedJS/toast.js"></script>
  <script src="../sharedJS/api-config.js"></script>
  <script src="../adminJS/admin-booking-receipt.js"></script>
</body>
</html>
