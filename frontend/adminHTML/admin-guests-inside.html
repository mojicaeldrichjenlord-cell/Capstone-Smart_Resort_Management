<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Redirecting | SmartResort</title>

    <link rel="stylesheet" href="../sharedCSS/global.css" />

    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: Arial, sans-serif;
      }

      .redirect-card {
        width: min(92vw, 520px);
        padding: 28px;
        border-radius: 22px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.1);
        text-align: center;
      }

      .redirect-card h1 {
        margin: 0 0 10px;
        font-size: 1.45rem;
      }

      .redirect-card p {
        margin: 0;
        color: #64748b;
        line-height: 1.6;
      }
    </style>
  </head>

  <body>
    <main class="redirect-card">
      <h1>Redirecting...</h1>
      <p>
        Guest operations are now handled by Front Desk.
      </p>
    </main>

    <script>
      (() => {
        let user = null;

        try {
          user = JSON.parse(localStorage.getItem("user") || "null");
        } catch (error) {
          console.error("Role redirect parse error:", error);
        }

        if (!user) {
          window.location.replace("../authHTML/login.html");
          return;
        }

        const role = String(user.role || "")
          .trim()
          .toLowerCase();

        const routes = {
          admin: "admin.html",
          frontdesk: "../frontdeskHTML/frontdeskGuests.html",
          staff: "../frontdeskHTML/frontdeskGuests.html",
          manager: "../managerHTML/managerDashboard.html",
          housekeeping: "../housekeepingHTML/housekeepingDashboard.html",
          customer: "../customerHTML/index.html",
        };

        window.location.replace(
          routes[role] || "../authHTML/login.html",
        );
      })();
    </script>
  </body>
</html>
